name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libltdl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        export BUILDOZER_ALLOW_KIVY_BUILD_0=1
        buildozer init
        sed -i 's/title = My Application/title = DEKAL Assistant/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = dekalassistant/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.dekal/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,vosk/g' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: bin/*.apk
        
